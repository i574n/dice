cargo-features = ["profile-rustflags", "edition2024"]

[workspace]
resolver = "2"
members = [
    "lib",
    "contract",
    "contract/tests",
    "ui",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/i574n/dice"

[workspace.dependencies]
chrono = "0.4"
regex = "1.10"
borsh = "1.5"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
futures = "0.3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
rustflags = ["-C", "link-arg=-s"]
